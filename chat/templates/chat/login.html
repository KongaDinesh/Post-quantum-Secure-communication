
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PQC Chat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #2563eb);
            padding: 20px;
        }
        .card {
            background: white; width: 100%; max-width: 410px;
            padding: 35px; border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }
        h1 { text-align: center; color: #172554; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }
        label { font-weight: bold; }
        input {
            width: 100%; padding: 12px; margin: 8px 0 18px;
            border: 1px solid #cbd5e1; border-radius: 7px;
        }
        button {
            width: 100%; padding: 13px; border: 0; border-radius: 7px;
            background: #2563eb; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        a { color: #2563eb; text-decoration: none; }
        .bottom { text-align: center; margin-top: 22px; color: #64748b; }
        .errorlist { color: #dc2626; }
        .helptext { color: #64748b; font-size: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 PQC Chat</h1>
        <p class="subtitle">Sign in to your account</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p class="bottom">
            Don't have an account?
            <a href="{% url 'register' %}">Create one</a>
        </p>
    </div>
</body>
</html>
